<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>better 𝕏</title>
  <link rel="stylesheet" href="popup.css">
  <script src="settings.js" defer></script>
  <script src="popup.js" defer></script>
  <script src="popup-image.js" defer></script>
  <script src="popup-fonts.js" defer></script>
</head>
<body>
  <header>
    <h1>better 𝕏</h1>
  </header>
  <div class="tabs" role="tablist" aria-label="Settings sections">
    <button type="button" role="tab" id="settings-tab" aria-controls="settings" aria-selected="true">Settings</button>
    <button type="button" role="tab" id="navigation-tab" aria-controls="navigation" aria-selected="false" tabindex="-1">Navigation</button>
    <button type="button" role="tab" id="image-export-tab" aria-controls="image-export" aria-selected="false" tabindex="-1">Image Export</button>
    <button type="button" role="tab" id="about-tab" aria-controls="about" aria-selected="false" tabindex="-1">About</button>
  </div>
  <form aria-label="better 𝕏 settings">
    <div class="panel" id="settings" role="tabpanel" aria-labelledby="settings-tab">
      <fieldset disabled>
        <legend>Privacy</legend>
        <label class="row">
          <span>Block ads</span>
          <input name="ads" type="checkbox" role="switch">
        </label>
        <label class="row">
          <span>Block telemetry</span>
          <input name="telemetry" type="checkbox" role="switch">
        </label>
        <label class="row">
          <span>Skip 18+ interstitials</span>
          <input name="ageWarning" type="checkbox" role="switch">
        </label>
      </fieldset>
      <fieldset disabled>
        <legend>Sharing</legend>
        <label class="row">
          <span>Clean copied links</span>
          <input name="cleanLinks" type="checkbox" role="switch">
        </label>
        <label class="row">
          <span>Link domain</span>
          <input name="linkHost" type="text" inputmode="url" autocomplete="off" autocapitalize="none"
            spellcheck="false" aria-describedby="status">
        </label>
        <label class="row">
          <span>Copy posts as images</span>
          <input name="copyImage" type="checkbox" role="switch">
        </label>
        <label class="row">
          <span>Direct downloads</span>
          <input name="downloads" type="checkbox" role="switch">
        </label>
      </fieldset>
      <fieldset disabled>
        <legend>Appearance</legend>
        <label class="row">
          <span>Quiet Mode</span>
          <input name="quiet" type="checkbox" role="switch">
        </label>
        <label class="row">
          <span>Theme</span>
          <select name="quietTheme">
            <option value="x">𝕏 default</option>
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </label>
        <div class="row">
          <span id="accent-label">Accent colour</span>
          <div class="swatches" role="group" aria-labelledby="accent-label">
            <button id="reset-accent" type="button" class="revert" title="Reset to 𝕏 default" aria-label="Reset accent colour">↺</button>
            <label class="swatch custom" title="Custom colour"><input name="quietAccent" type="color" aria-label="Custom colour"></label>
          </div>
        </div>
        <label class="row">
          <span>Feed width (px)</span>
          <input name="quietWidth" type="number" min="480" max="1000" step="10" placeholder="Default">
        </label>
        <label class="row">
          <span>UI font size (px)</span>
          <input name="quietUiSize" type="number" min="11" max="18" step="1" placeholder="Default">
        </label>
        <label class="row">
          <span>Text font size (px)</span>
          <input name="quietSize" type="number" min="12" max="20" step="1" placeholder="Default">
        </label>
        <div class="row font-row">
          <label for="quiet-font">Font</label>
          <input id="quiet-font" name="quietFont" type="text" role="combobox" aria-autocomplete="list"
            aria-expanded="false" aria-controls="quiet-fonts" placeholder="𝕏 default" autocomplete="off" spellcheck="false">
          <div class="picker" id="quiet-fonts" role="listbox" hidden></div>
        </div>
        <label class="row emoji-font-row">
          <span>Emoji Font</span>
          <select id="emoji-font" name="emojiFont" aria-describedby="emoji-status" disabled></select>
        </label>
        <p id="emoji-status" role="status" hidden></p>
        <details class="emoji-library">
          <summary>Emoji Downloads</summary>
          <p class="font-status" id="font-library-status" role="status" hidden></p>
          <ul id="emoji-downloads"></ul>
        </details>
      </fieldset>
      <p id="status" role="status" hidden></p>
    </div>
    <div class="panel" id="navigation" role="tabpanel" aria-labelledby="navigation-tab" hidden>
      <fieldset disabled id="navigation-items">
        <legend class="visually-hidden">Visible navigation items</legend>
      </fieldset>
    </div>
  </form>
  <div class="panel" id="image-export" role="tabpanel" aria-labelledby="image-export-tab" hidden>
    <form id="image-export-form" aria-label="Image export settings">
      <fieldset disabled>
        <label class="row">Layout
          <select name="surface">
            <option value="web-timeline">Web Timeline</option>
            <option value="web-detail">Web Detail</option>
            <option value="ios-timeline">iOS Timeline</option>
            <option value="ios-detail">iOS Detail</option>
          </select>
        </label>
        <label class="row">Width (px)
          <input type="number" name="width" min="280" max="1200" step="1" required>
        </label>
        <label class="row">Pixel Density
          <select name="dpr">
            <option value="1">1×</option>
            <option value="2">2×</option>
            <option value="3">3×</option>
          </select>
        </label>
        <label class="row">Theme
          <select name="theme">
            <option value="auto">Auto</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <label class="row">Expanded Text
          <input type="checkbox" name="expanded" role="switch">
        </label>
        <label class="row">Auto-expand “Show more”
          <input type="checkbox" name="autoExpand" role="switch">
        </label>
      </fieldset>
      <p class="image-export-status" role="status" hidden></p>
    </form>
  </div>
  <div class="panel" id="about" role="tabpanel" aria-labelledby="about-tab" hidden>
    <dl class="about-details">
      <div class="row"><dt>Version</dt><dd id="about-version"></dd></div>
      <div class="row"><dt>Author</dt><dd id="about-author"></dd></div>
      <div class="row"><dt>Source</dt><dd><a id="about-repo" target="_blank" rel="noopener noreferrer">GitHub Repository</a></dd></div>
    </dl>
    <section aria-labelledby="storage-title">
      <h2 id="storage-title">Storage</h2>
      <dl class="about-details">
        <div class="row"><dt>Total Stored Data</dt><dd id="storage-total">Loading</dd></div>
        <div class="row"><dt>Emoji Fonts</dt><dd id="storage-emoji">Loading</dd></div>
      </dl>
      <button type="button" class="text-button" id="clear-fonts" disabled>Clear Font Caches</button>
      <p class="font-status" id="font-storage-status" role="status" hidden></p>
    </section>
  </div>
  <template id="emoji-download-row">
    <li class="row">
      <span class="font-name"></span>
      <span class="font-download-meta"></span>
      <button type="button" class="text-button font-download" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-download preview-icon" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>
      </button>
    </li>
  </template>
</body>
</html>
