name: Release extension

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Package the extension
        run: |
          version=$(jq -er '.version' extension/manifest.json)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME must match manifest version v$version." >&2
            exit 1
          fi
          git archive --format=zip --output="better-x-$GITHUB_REF_NAME.zip" HEAD:extension

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="better-x-$GITHUB_REF_NAME.zip"
          gh release create "$GITHUB_REF_NAME" "$asset" --verify-tag --generate-notes
